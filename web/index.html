<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>采购受理 Agent</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
           background: #f4f5f7; color: #1f2329; height: 100vh; display: flex; }
    #main { flex: 1; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; }
    header { padding: 14px 20px; background: #2b5cff; color: #fff; font-weight: 600; }
    header small { font-weight: 400; opacity: .8; margin-left: 8px; }
    #log { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .msg { margin: 10px 0; display: flex; }
    .msg.user { justify-content: flex-end; }
    .bubble { max-width: 78%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap;
              line-height: 1.5; font-size: 14px; }
    .user .bubble { background: #2b5cff; color: #fff; border-bottom-right-radius: 2px; }
    .bot .bubble { background: #fff; border: 1px solid #e5e6eb; border-bottom-left-radius: 2px; }
    .meta { font-size: 12px; color: #86909c; margin: 2px 6px; }
    .step { font-size: 12px; color: #86909c; margin: 4px 10px; font-style: italic; }
    #confirm { background: #fff7e6; border: 1px solid #ffd591; border-radius: 12px;
               padding: 12px 14px; margin: 10px 0; font-size: 14px; }
    #confirm button { margin-right: 8px; margin-top: 8px; padding: 6px 16px; border: none;
                      border-radius: 6px; cursor: pointer; font-size: 14px; }
    .ok { background: #2b5cff; color: #fff; } .no { background: #e5e6eb; }
    #panel { padding: 8px 20px; font-size: 12px; color: #4e5969; border-top: 1px solid #e5e6eb;
             background: #fafbfc; min-height: 22px; }
    #bar { display: flex; padding: 12px 20px; border-top: 1px solid #e5e6eb; background: #fff; }
    #inp { flex: 1; padding: 10px 12px; border: 1px solid #c9cdd4; border-radius: 8px; font-size: 14px; }
    #send { margin-left: 8px; padding: 0 20px; border: none; border-radius: 8px;
            background: #2b5cff; color: #fff; cursor: pointer; }
    #send:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <div id="main">
    <header>采购受理 Agent<small>多轮 · 历史复用 · 人在环确认 · 花费分析</small></header>
    <div id="log"></div>
    <div id="panel"></div>
    <div id="bar">
      <input id="inp" placeholder="例如：我要买几个轴承 / 哪个类别花钱最多" autofocus />
      <button id="send">发送</button>
    </div>
  </div>

  <script>
    // thread_id 标识一段会话；服务端按它持久化多轮记忆。刷新换新会话。
    const threadId = "web-" + Math.random().toString(36).slice(2);
    const log = document.getElementById("log");
    const panel = document.getElementById("panel");
    const inp = document.getElementById("inp");
    const send = document.getElementById("send");

    function addMsg(text, who) {
      const row = document.createElement("div");
      row.className = "msg " + who;
      row.innerHTML = `<div class="bubble"></div>`;
      row.querySelector(".bubble").textContent = text;
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
    }

    function showPanel(data) {
      if (data.draft) {
        const d = data.draft;
        panel.textContent = `采购单草稿：物料=${d.item_name ?? "-"} 链接=${d.item_url ?? "-"} `
          + `份数=${d.quantity ?? "-"} 项目=${d.project_code ?? "-"} | 缺=${(data.missing||[]).join(",")||"无"} | 阶段=${data.stage}`;
      } else if (data.analysis) {
        panel.textContent = `分析口径：${data.analysis.method} | 关键数字：${JSON.stringify(data.analysis.figures)}`;
      } else {
        panel.textContent = data.route ? `路由：${data.route}` : "";
      }
    }

    // HITL：服务端停在 interrupt 时，弹确认框，按钮把 y/n 用 /resume 喂回去。
    function showConfirm(data) {
      const box = document.createElement("div");
      box.id = "confirm";
      box.innerHTML = `⚠ 需要确认（不可逆动作）<br>动作：<b>${data.tool}</b><br>`
        + `参数：${JSON.stringify(data.args, null, 0)}<br>`
        + `<button class="ok">确认执行</button><button class="no">取消</button>`;
      log.appendChild(box);
      log.scrollTop = log.scrollHeight;
      box.querySelector(".ok").onclick = () => { box.remove(); streamPost("/resume/stream", { thread_id: threadId, decision: "y" }); };
      box.querySelector(".no").onclick = () => { box.remove(); streamPost("/resume/stream", { thread_id: threadId, decision: "n" }); };
    }

    function addStep(text) {
      const el = document.createElement("div");
      el.className = "step";
      el.textContent = "· " + text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }

    function handle(data) {
      if (data.type === "step") { addStep(data.label); return; }
      if (data.type === "interrupt") { showConfirm(data); return; }
      if (data.type === "reply") { addMsg(data.reply, "bot"); showPanel(data); return; }
      // type === "done"：流结束，无需处理
    }

    // 读 SSE 流：按 "\n\n" 切帧，取 data: 行解析成事件逐个 handle。
    async function streamPost(url, body) {
      send.disabled = true;
      try {
        const resp = await fetch(url, {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
        });
        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let buf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let i;
          while ((i = buf.indexOf("\n\n")) >= 0) {
            const frame = buf.slice(0, i); buf = buf.slice(i + 2);
            const line = frame.split("\n").find((l) => l.startsWith("data:"));
            if (line) handle(JSON.parse(line.slice(5).trim()));
          }
        }
      } catch (e) {
        addMsg("（网络错误：" + e + "）", "bot");
      } finally {
        send.disabled = false; inp.focus();
      }
    }

    function submit() {
      const text = inp.value.trim();
      if (!text) return;
      addMsg(text, "user");
      inp.value = "";
      streamPost("/chat/stream", { thread_id: threadId, message: text });
    }
    send.onclick = submit;
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  </script>
</body>
</html>
