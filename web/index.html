<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>采购受理 Agent</title>
  <!-- marked：把大模型输出的 Markdown(加粗/表格/列表)渲染成 HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
           background: #f4f5f7; color: #1f2329; height: 100vh; display: flex; }
    #main { flex: 1; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; }
    header { padding: 14px 20px; background: #2b5cff; color: #fff; font-weight: 600; }
    header small { font-weight: 400; opacity: .8; margin-left: 8px; }
    #log { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .msg { margin: 10px 0; display: flex; }
    .msg.user { justify-content: flex-end; }
    .bubble { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; font-size: 14px; }
    .user .bubble { background: #2b5cff; color: #fff; border-bottom-right-radius: 2px; white-space: pre-wrap; }
    .bot .bubble { background: #fff; border: 1px solid #e5e6eb; border-bottom-left-radius: 2px; }
    /* 实时状态气泡：思考中 / 显示当前步骤，淡色+呼吸动画 */
    .bubble.thinking { color: #86909c; font-style: italic; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    /* 渲染后的 Markdown 在气泡里的排版 */
    .bot .bubble p { margin: 0 0 8px; } .bot .bubble p:last-child { margin-bottom: 0; }
    .bot .bubble ul, .bot .bubble ol { margin: 6px 0; padding-left: 20px; }
    .bot .bubble table { border-collapse: collapse; margin: 6px 0; font-size: 13px; }
    .bot .bubble th, .bot .bubble td { border: 1px solid #e5e6eb; padding: 4px 8px; }
    .bot .bubble th { background: #f7f8fa; }
    .bot .bubble code { background: #f2f3f5; padding: 1px 5px; border-radius: 4px; }
    .bot .bubble pre { background: #f2f3f5; padding: 8px; border-radius: 6px; overflow-x: auto; }
    #confirm { background: #fff7e6; border: 1px solid #ffd591; border-radius: 12px;
               padding: 12px 14px; margin: 10px 0; font-size: 14px; }
    #confirm button { margin-right: 8px; margin-top: 8px; padding: 6px 16px; border: none;
                      border-radius: 6px; cursor: pointer; font-size: 14px; }
    .ok { background: #2b5cff; color: #fff; } .no { background: #e5e6eb; }
    #panel { padding: 8px 20px; font-size: 12px; color: #4e5969; border-top: 1px solid #e5e6eb;
             background: #fafbfc; min-height: 22px; }
    #bar { display: flex; padding: 12px 20px; border-top: 1px solid #e5e6eb; background: #fff; }
    #inp { flex: 1; padding: 10px 12px; border: 1px solid #c9cdd4; border-radius: 8px; font-size: 14px; }
    #send { margin-left: 8px; padding: 0 20px; border: none; border-radius: 8px;
            background: #2b5cff; color: #fff; cursor: pointer; }
    #send:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <div id="main">
    <header>采购受理 Agent<small>多轮 · 历史复用 · 人在环确认 · 花费分析 · 合规查验</small></header>
    <div id="log"></div>
    <div id="panel"></div>
    <div id="bar">
      <input id="inp" placeholder="例如：我要买几个轴承 / 哪个类别花钱最多 / 米思米合规吗" autofocus />
      <button id="send">发送</button>
    </div>
  </div>

  <script>
    // thread_id 标识一段会话；服务端按它持久化多轮记忆。刷新换新会话。
    const threadId = "web-" + Math.random().toString(36).slice(2);
    const log = document.getElementById("log");
    const panel = document.getElementById("panel");
    const inp = document.getElementById("inp");
    const send = document.getElementById("send");

    const renderMd = (t) => (window.marked ? marked.parse(t) : t);

    function addBubble(who) {
      const row = document.createElement("div");
      row.className = "msg " + who;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      row.appendChild(bubble);
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
      return { row, bubble };
    }

    function addUser(text) {
      addBubble("user").bubble.textContent = text;
    }

    // 每一轮共用一个"实时状态气泡"：先显示思考中，随每个步骤原地更新，最后变成答案。
    let live = null; // {row, bubble}

    function startLive() {
      live = addBubble("bot");
      live.bubble.classList.add("thinking");
      live.bubble.textContent = "思考中…";
    }

    function showPanel(data) {
      if (data.draft) {
        const d = data.draft;
        panel.textContent = `采购单草稿：物料=${d.item_name ?? "-"} 链接=${d.item_url ?? "-"} `
          + `份数=${d.quantity ?? "-"} 项目=${d.project_code ?? "-"} | 缺=${(data.missing || []).join(",") || "无"} | 阶段=${data.stage}`;
      } else if (data.analysis) {
        panel.textContent = `分析口径：${data.analysis.method} | 关键数字：${JSON.stringify(data.analysis.figures)}`;
      } else if (data.compliance) {
        panel.textContent = `合规：${data.compliance.supplier} ${JSON.stringify(data.compliance.flags)} | 全合规=${data.compliance.compliant}`;
      } else {
        panel.textContent = data.route ? `路由：${data.route}` : "";
      }
    }

    function showConfirm(data) {
      const box = document.createElement("div");
      box.id = "confirm";
      box.innerHTML = `⚠ 需要确认（不可逆动作）<br>动作：<b>${data.tool}</b><br>`
        + `参数：${JSON.stringify(data.args)}<br>`
        + `<button class="ok">确认执行</button><button class="no">取消</button>`;
      log.appendChild(box);
      log.scrollTop = log.scrollHeight;
      box.querySelector(".ok").onclick = () => { box.remove(); streamPost("/resume/stream", { thread_id: threadId, decision: "y" }); };
      box.querySelector(".no").onclick = () => { box.remove(); streamPost("/resume/stream", { thread_id: threadId, decision: "n" }); };
    }

    function handle(data) {
      if (data.type === "step") {
        if (!live) startLive();
        live.bubble.textContent = "· " + data.label; // 步骤原地刷新，不刷屏
        log.scrollTop = log.scrollHeight;
      } else if (data.type === "interrupt") {
        if (live) { live.row.remove(); live = null; }
        showConfirm(data);
      } else if (data.type === "reply") {
        if (!live) startLive();
        live.bubble.classList.remove("thinking");
        live.bubble.innerHTML = renderMd(data.reply); // 状态气泡直接变成渲染好的答案
        live = null;
        showPanel(data);
        log.scrollTop = log.scrollHeight;
      }
      // type === "done"：流结束，无需处理
    }

    // 读 SSE 流：按 "\n\n" 切帧，取 data: 行解析成事件逐个 handle。
    async function streamPost(url, body) {
      send.disabled = true;
      startLive(); // 立刻给"思考中"反馈，消除点完发送后的空白
      try {
        const resp = await fetch(url, {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
        });
        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let buf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let i;
          while ((i = buf.indexOf("\n\n")) >= 0) {
            const frame = buf.slice(0, i); buf = buf.slice(i + 2);
            const line = frame.split("\n").find((l) => l.startsWith("data:"));
            if (line) handle(JSON.parse(line.slice(5).trim()));
          }
        }
      } catch (e) {
        if (live) { live.bubble.classList.remove("thinking"); live.bubble.textContent = "（网络错误：" + e + "）"; live = null; }
        else addBubble("bot").bubble.textContent = "（网络错误：" + e + "）";
      } finally {
        send.disabled = false; inp.focus();
      }
    }

    function submit() {
      const text = inp.value.trim();
      if (!text) return;
      addUser(text);
      inp.value = "";
      streamPost("/chat/stream", { thread_id: threadId, message: text });
    }
    send.onclick = submit;
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  </script>
</body>
</html>
