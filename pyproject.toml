[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "procurement-agent"
version = "0.1.0"
description = "基于 LangGraph 的采购受理 Agent（从 xTool 机械部自采系统演进而来）"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.50",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
]

[tool.setuptools]
packages = ["agent"]

[tool.ruff]
line-length = 100
